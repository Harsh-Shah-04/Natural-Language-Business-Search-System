[project]
name = "business-search-backend"
version = "0.1.0"
description = "Natural language business search — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymongo>=4.9",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "sentence-transformers>=3.0",
    # app/llm.py imports httpx directly (M6.2). It already arrives transitively
    # via Starlette, but a direct import belongs in the direct dependencies --
    # otherwise the intent layer breaks the day that transitive edge changes.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
